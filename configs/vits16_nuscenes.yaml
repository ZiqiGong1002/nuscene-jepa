# V-JEPA 预训练配置:ViT-S/16 @ nuScenes mini(第6环产物,服务第7环过拟合验证)
# 基线:官方 configs/pretrain/vitl16.yaml(2026-07-15 自 GitHub main 分支原文抄改)
# 改动仅限已定案决策项 + 单卡/mini 适配,masking/EMA/lr/wd 全部保持官方默认
app: vjepa
nodes: 1              # 官方 16 → 单机
tasks_per_node: 1     # 官方 8 → 单卡 4080 12GB
data:
  dataset_type: VideoDataset
  datasets:
    - ../data/nuscenes_mini_clips.csv   # 92 clips, 空格分隔无表头"路径 标签"
  decode_one_clip: true
  batch_size: 8       # 官方 24 → 12GB 起步值,OOM 再降
  num_clips: 1
  num_frames: 4       # 官方 16 → 定案:4 帧
  tubelet_size: 2
  sampling_rate: 2    # 官方 4 → 定案:10Hz 数据下帧间距 ~200ms,处 100–400ms 甜区
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 4      # 官方 12 → WSL 内存 15G,保守起步
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
logging:
  folder: ../logs/vits16_nuscenes/
  write_tag: jepa
loss:
  loss_exp: 1.0
  reg_coeff: 0.0
mask:
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 8
    spatial_scale:
      - 0.15
      - 0.15
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 2
    spatial_scale:
      - 0.7
      - 0.7
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
meta:
  load_checkpoint: false
  read_checkpoint: null
  seed: 234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
model:
  model_name: vit_small   # 官方 vit_large → 定案:③ 用 ViT-S
  pred_depth: 12
  pred_embed_dim: 384
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true
optimization:
  ipe: 100              # 官方 300;92 clip/batch 8 ≈ 12 步一轮,100 步/epoch 由 loader 循环采样凑足
  ipe_scale: 1.25
  clip_grad: 10.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 10            # 官方 300 → 第7环只需几百步验证 loss 下降,10×100=1000 步封顶,可提前停
  warmup: 1             # 官方 40 → 随 epochs 等比缩短
  start_lr: 0.0002
  lr: 0.000625
  final_lr: 1.0e-06
  ema:
  - 0.998
  - 1.0
